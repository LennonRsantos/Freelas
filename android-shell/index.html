<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Freelas</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1e293b;
        color: #fff;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      main {
        box-sizing: border-box;
        min-height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        max-width: 420px;
        margin: 0 auto;
      }
      .logo {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .logo span {
        color: #ff6b00;
      }
      h1 {
        margin: 24px 0 0;
        font-size: 24px;
      }
      p {
        margin: 0;
        color: #cbd5e1;
        line-height: 1.5;
      }
      button {
        margin-top: 8px;
        height: 52px;
        border: 0;
        border-radius: 12px;
        background: #ff6b00;
        color: #0f172a;
        font-size: 16px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">Freelas<span>.</span></div>
      <h1>Sem conexão</h1>
      <p>Não foi possível abrir o Freelas. Confira se o celular está conectado à internet.</p>
      <button type="button" onclick="location.href = 'https://freelasbr.vercel.app/'">
        Tentar de novo
      </button>
    </main>
  </body>
</html>
